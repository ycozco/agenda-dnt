# ==============================================================================
# SILLAR DENTAL OS - CONFIGURACIÓN DE PRODUCCIÓN ENDURECIDA (NGINX PROD)
# Mitigaciones aplicadas: SEC-001, SEC-002, SEC-007, SEC-008
# Cumplimiento: NTS 139-MINSA / Ley 29733 de Protección de Datos Personales
# ==============================================================================

# Zonas de limitación de tasa (Rate Limiting) para prevenir fuerza bruta y scraping
limit_req_zone $binary_remote_addr zone=api_auth_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=public_booking_limit:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=addr_conn_limit:10m;

server {
    listen 80;
    listen [::]:80;
    server_name api.sillardental.pe *.sillardental.pe;

    # Redirección obligatoria a HTTPS en entorno de producción
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.sillardental.pe *.sillardental.pe;

    charset utf-8;
    absolute_redirect off;

    # Certificados TLS gestionados por Caddy / Let's Encrypt / Certbot
    ssl_certificate /etc/ssl/certs/sillardental_fullchain.pem;
    ssl_certificate_key /etc/ssl/private/sillardental_privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Directorio de distribución de producción (código compilado)
    root /usr/share/nginx/html/dist;
    index index.html;

    # Límites de conexión
    limit_conn addr_conn_limit 20;

    # Compresión optimizada
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/html
        text/css
        text/plain
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2
        application/pdf;

    # ==========================================================================
    # CABECERAS DE SEGURIDAD DEFENSIVAS (SEC-008)
    # ==========================================================================
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Política CSP estricta en producción
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.sillardental.pe wss://api.sillardental.pe; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # ==========================================================================
    # BLOQUEO ESTRICTO DE RUTAS DE DESARROLLO, SEED Y ARCHIVOS SENSIBLES (SEC-002, SEC-007)
    # ==========================================================================
    location ~* /(data|prototype|prototipo-stitc|\.git|\.env|dev_server\.js|package\.json|node_modules)/ {
        deny all;
        return 404;
    }

    location ~* \.(env|git|yml|yaml|md|log|sh|bat|bak|sql)$ {
        deny all;
        return 404;
    }

    # ==========================================================================
    # PROXY INVERSO AL BACKEND SEGURO (OIDC, RBAC, POSTGRESQL RLS) (SEC-001, SEC-004)
    # ==========================================================================
    location /api/ {
        limit_req zone=api_auth_limit burst=10 nodelay;
        proxy_pass http://dental-backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Endpoint de reserva pública con protección anti-abuso / rate-limiting
    location /api/v1/public/bookings {
        limit_req zone=public_booking_limit burst=5 nodelay;
        proxy_pass http://dental-backend:3000/api/v1/public/bookings;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Caché inmutable para estáticos versionados
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # SPA Routing estándar
    location / {
        try_files $uri $uri/ /index.html;
    }
}
