<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockups Móviles del Paciente · Sillar Dental</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <style>
    body { background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .mobile-frame { width: 390px; height: 844px; background: var(--paper); color: var(--ink); border-radius: 44px; border: 12px solid #334155; box-shadow: 0 25px 60px rgba(0,0,0,0.6); display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .mobile-header { background: var(--surface); padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
    .mobile-content { flex: 1; padding: 20px; overflow-y: auto; }
    .bottom-nav { background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); touch-action: manipulation; }
    .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.7rem; font-weight: 600; color: var(--ink-soft); text-decoration: none; }
    .nav-btn.active { color: var(--blue); }
  </style>
</head>
<body>

  <div class="mobile-frame">
    <!-- Header -->
    <div class="mobile-header">
      <div style="font-weight: 700; font-family: var(--display); font-size: 1.1rem; color: var(--blue-deep);">Sillar Dental</div>
      <span class="chip chip-neutral" style="font-size: 0.68rem;">María Q.</span>
    </div>

    <!-- Mobile Body -->
    <div class="mobile-content" id="mobileContent">
      <!-- Rendered by Hash Navigation -->
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
      <a href="#home" class="nav-btn active" id="btn-home"><span>🏠</span>Inicio</a>
      <a href="#appointments" class="nav-btn" id="btn-appointments"><span>📅</span>Citas</a>
      <a href="#treatment" class="nav-btn" id="btn-treatment"><span>🦷</span>Tratamiento</a>
      <a href="#documents" class="nav-btn" id="btn-documents"><span>📁</span>Documentos</a>
      <a href="#payments" class="nav-btn" id="btn-payments"><span>💳</span>Pagos</a>
    </div>
  </div>

  <script type="module">
    import { SEED_V2 } from '../data/seed-v2.js';
    import { sanitizeDecorativeIcons } from '../assets/js/components.js';

    function renderMobileView() {
      const hash = window.location.hash || "#home";
      const container = document.getElementById("mobileContent");

      document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
      const activeBtn = document.getElementById(`btn-${hash.replace("#", "")}`);
      if (activeBtn) activeBtn.classList.add("active");

      if (hash === "#home") {
        container.innerHTML = `
          <div style="margin-bottom: 16px;">
            <span class="eyebrow" style="font-size: 0.68rem;">Hola, María 👋</span>
            <h2 style="font-size: 1.3rem; margin-bottom: 4px;">Tu próxima cita</h2>
          </div>

          <div class="card" style="padding: 16px; margin-bottom: 16px; border-left: 4px solid var(--blue);">
            <div style="font-size: 0.8rem; font-weight: 700; color: var(--blue);">${SEED_V2.patient.nextAppointment.date} · ${SEED_V2.patient.nextAppointment.time}</div>
            <h4 style="margin: 6px 0 4px; font-size: 0.95rem;">${SEED_V2.patient.nextAppointment.reason}</h4>
            <p class="tiny" style="margin: 0;">${SEED_V2.patient.nextAppointment.practitionerName}</p>
          </div>

          <div class="card" style="padding: 16px;">
            <h4 style="font-size: 0.9rem; margin-bottom: 6px;">Progreso de Tratamiento</h4>
            <div class="progress" style="height: 8px; margin-bottom: 6px;">
              <span style="width: ${SEED_V2.patient.activeTreatment.progressPercent}%;"></span>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--ink-soft);">
              <span>Fase 2 de 4</span>
              <strong>${SEED_V2.patient.activeTreatment.progressPercent}%</strong>
            </div>
          </div>
        `;
      } else if (hash === "#appointments") {
        container.innerHTML = `
          <h2 style="font-size: 1.3rem; margin-bottom: 16px;">Mis Citas</h2>
          <div class="card" style="padding: 16px;">
            <span class="chip chip-success" style="font-size: 0.68rem;">Confirmada</span>
            <h4 style="margin: 8px 0 4px;">${SEED_V2.patient.nextAppointment.date}</h4>
            <p class="tiny">${SEED_V2.patient.nextAppointment.reason}</p>
          </div>
        `;
      } else if (hash === "#treatment") {
        container.innerHTML = `
          <h2 style="font-size: 1.3rem; margin-bottom: 16px;">Tratamiento & FDI</h2>
          <div class="card" style="padding: 16px;">
            <h4 style="font-size: 0.9rem;">Odontograma de María</h4>
            <p class="tiny" style="margin-top: 4px;">Piezas con hallazgos registrados: 5</p>
          </div>
        `;
      } else if (hash === "#documents") {
        container.innerHTML = `
          <h2 style="font-size: 1.3rem; margin-bottom: 16px;">Documentos</h2>
          ${SEED_V2.documents.map(d => `
            <div class="card" style="padding: 14px; margin-bottom: 10px;">
              <span class="chip chip-neutral" style="font-size: 0.65rem;">${d.type}</span>
              <h4 style="font-size: 0.88rem; margin: 4px 0;">${d.title}</h4>
              <a href="../patient/viewers/${d.type === 'PDF' ? 'pdf.html' : 'radiografia.html'}?id=${d.id}" class="btn btn-secondary btn-small" style="width: 100%; margin-top: 8px; font-size: 0.75rem;">Abrir Visor</a>
            </div>
          `).join("")}
        `;
      } else if (hash === "#payments") {
        container.innerHTML = `
          <h2 style="font-size: 1.3rem; margin-bottom: 16px;">Pagos & Cuotas</h2>
          <div class="card" style="padding: 16px; background: var(--blue-soft); margin-bottom: 16px;">
            <span class="eyebrow" style="font-size: 0.65rem;">Saldo Pendiente</span>
            <h3 style="color: var(--blue-deep); margin: 4px 0 0;">S/ ${SEED_V2.patient.activeTreatment.balanceDue}.00</h3>
          </div>
        `;
      }
      sanitizeDecorativeIcons();
    }

    window.addEventListener("hashchange", renderMobileView);
    renderMobileView();
  </script>
</body>
</html>
