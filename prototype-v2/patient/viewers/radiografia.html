<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor Radiológico & CBCT · Sillar Dental</title>
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <style>
    body { background: #090d16; color: white; min-height: 100vh; display: flex; flex-direction: column; }
    .viewer-toolbar { background: #111827; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f2937; }
    .viewer-body { flex: 1; display: grid; grid-template-columns: 1fr 300px; }
    .viewer-stage { display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 20px; background: #000; position: relative; }
    .viewer-sidebar { background: #111827; border-left: 1px solid #1f2937; padding: 24px; }
    .control-group { margin-bottom: 20px; }
    .control-group label { display: flex; justify-content: space-between; font-size: 0.84rem; color: #9ca3af; margin-bottom: 8px; }
    .range-input { width: 100%; accent-color: var(--blue); }
  </style>
</head>
<body>

  <div class="viewer-toolbar">
    <div style="display: flex; align-items: center; gap: 16px;">
      <a href="../index.html?view=documents" style="color: #9ca3af; text-decoration: none; font-size: 0.9rem;">← Volver a Documentos</a>
      <span style="font-weight: 600; font-size: 0.95rem;">Radiografía Panorámica CBCT — María Quispe</span>
    </div>
    <span class="chip chip-neutral" style="background: #1f2937; color: #9ca3af;">Material Diagnóstico Demostrativo</span>
  </div>

  <div class="viewer-body">
    <div class="viewer-stage">
      <div style="overflow: hidden; max-width: 100%; max-height: 100%; border-radius: 8px;">
        <img src="../../assets/images/public/technology/evaluacion-dental-digital-5622234.jpg" id="radImage" alt="Radiografía panorámica CBCT de referencia" style="max-width: 100%; height: auto; display: block; transition: filter 0.05s ease, transform 0.05s ease;">
      </div>
    </div>

    <div class="viewer-sidebar">
      <h3 style="color: white; margin-bottom: 20px; font-size: 1.1rem;">Ajustes de Imagen</h3>

      <div class="control-group">
        <label>Zoom <span id="valZoom">100%</span></label>
        <input type="range" class="range-input" id="inputZoom" min="100" max="250" value="100">
      </div>

      <div class="control-group">
        <label>Brillo <span id="valBrightness">100%</span></label>
        <input type="range" class="range-input" id="inputBrightness" min="50" max="200" value="100">
      </div>

      <div class="control-group">
        <label>Contraste <span id="valContrast">100%</span></label>
        <input type="range" class="range-input" id="inputContrast" min="50" max="200" value="100">
      </div>

      <button class="btn btn-secondary btn-small" id="resetBtn" style="width: 100%; margin-top: 10px; color: white; border-color: #374151;">Restablecer Ajustes</button>

      <div style="margin-top: 40px; border-top: 1px solid #1f2937; padding-top: 20px;">
        <h4 style="font-size: 0.9rem; color: #9ca3af; margin-bottom: 10px;">Metadatos</h4>
        <div style="font-size: 0.8rem; color: #6b7280; display: grid; gap: 6px;">
          <div>📅 <strong>Fecha:</strong> 10-07-2026</div>
          <div>👨‍⚕️ <strong>Solicitante:</strong> Dra. Ana Flores</div>
          <div>📸 <strong>Sede:</strong> Sillar Yanahuara CBCT-01</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    const img = document.getElementById("radImage");
    const inputZoom = document.getElementById("inputZoom");
    const inputBrightness = document.getElementById("inputBrightness");
    const inputContrast = document.getElementById("inputContrast");

    const valZoom = document.getElementById("valZoom");
    const valBrightness = document.getElementById("valBrightness");
    const valContrast = document.getElementById("valContrast");

    function updateFilters() {
      const z = inputZoom.value;
      const b = inputBrightness.value;
      const c = inputContrast.value;

      valZoom.innerText = `${z}%`;
      valBrightness.innerText = `${b}%`;
      valContrast.innerText = `${c}%`;

      img.style.transform = `scale(${z / 100})`;
      img.style.filter = `brightness(${b}%) contrast(${c}%)`;
    }

    inputZoom.addEventListener("input", updateFilters);
    inputBrightness.addEventListener("input", updateFilters);
    inputContrast.addEventListener("input", updateFilters);

    document.getElementById("resetBtn").addEventListener("click", () => {
      inputZoom.value = 100;
      inputBrightness.value = 100;
      inputContrast.value = 100;
      updateFilters();
    });
  </script>
</body>
</html>
