<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plana Médica & Especialistas · Sillar Dental</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
</head>
<body>

  <div id="headerApp"></div>

  <section style="background: var(--surface); padding: 50px 0 30px; border-bottom: 1px solid var(--line);">
    <div class="container">
      <span class="eyebrow">Cuerpo Médico</span>
      <h1>Equipo Profesional</h1>
      <p class="muted" style="max-width: 640px; font-size: 1.1rem;">Conoce a los 8 cirujanos dentistas colegiados y especialistas a cargo de la atención en Sillar Dental Yanahuara.</p>
    </div>
  </section>

  <section class="container" style="padding: 50px 0;">
    <div id="teamGrid" class="grid-4"></div>
  </section>

  <div id="footerApp"></div>

  <script type="module">
    import { renderPublicHeader, renderPublicFooter, setupHeaderInteractions } from '../assets/js/components.js';
    import { SEED_V2 } from '../data/seed-v2.js';

    document.getElementById("headerApp").innerHTML = renderPublicHeader("equipo");
    document.getElementById("footerApp").innerHTML = renderPublicFooter();
    setupHeaderInteractions();

    const teamGrid = document.getElementById("teamGrid");
    teamGrid.innerHTML = SEED_V2.practitioners.map(doc => `
      <div class="card" style="padding: 20px; display: flex; flex-direction: column; justify-content: space-between;">
        <div>
          <img src="${doc.photo}" alt="${doc.name}" style="width: 100%; height: 200px; object-fit: cover; border-radius: 12px; margin-bottom: 14px;">
          <span class="eyebrow" style="font-size: 0.68rem; margin-bottom: 4px;">${doc.cmp}</span>
          <h3 style="font-size: 1.05rem; margin-bottom: 4px;">${doc.name}</h3>
          <p class="muted" style="font-size: 0.84rem; margin-bottom: 10px;">${doc.specialty}</p>
          <p class="muted" style="font-size: 0.8rem; line-height: 1.5; margin-bottom: 16px;">${doc.bio}</p>
        </div>
        <a href="profesional.html?id=${doc.id}" class="btn btn-secondary btn-small" style="width: 100%;">Ver ficha clínica</a>
      </div>
    `).join("");
  </script>
</body>
</html>
