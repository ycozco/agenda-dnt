server {
    listen 80;
    server_name localhost;
    charset utf-8;

    # Preservar el puerto en la redirección enviando rutas relativas (Location: /public/index.html)
    absolute_redirect off;

    root /usr/share/nginx/html/prototype-v2;
    index public/index.html;

    # Compresión Gzip para alto rendimiento en pruebas y despliegue
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2
        application/pdf;

    # Cabeceras de seguridad HTTP
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' ws: wss:; frame-ancestors 'self';" always;

    # Redirección automática de la raíz http://localhost:8085/ a /public/index.html
    location = / {
        return 302 /public/index.html;
    }

    # Soporte para prototipo v1 en /prototype/
    location /prototype/ {
        alias /usr/share/nginx/html/prototype/;
        index index.html;
    }

    # Soporte para prototipos Stitch en /prototipo-stitc/
    location /prototipo-stitc/ {
        alias /usr/share/nginx/html/prototipo-stitc/;
        index index.html;
    }

    # Cabeceras para desarrollo y pruebas inmediatas (sin caché congelada en navegador)
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    # Bloqueo total de /data/ (datos internos y semillas protegidas)
    location ^~ /data/ {
        return 404;
    }

    # Acceso público a recursos estáticos compartidos
    location ^~ /assets/ {
        try_files $uri =404;
    }
    location ^~ /components/ {
        try_files $uri =404;
    }
    location ^~ /styles/ {
        try_files $uri =404;
    }

    # Puerta de entrada y login de Staff (público)
    location = /staff/login.html {
        try_files $uri =404;
    }

    # Protección de consola Staff (requiere cookie de sesión sillar_staff_auth)
    location /staff/ {
        if ($http_cookie !~* "sillar_staff_auth") {
            return 302 /staff/login.html;
        }
        try_files $uri $uri/ =404;
    }

    # Puerta de entrada y login de Paciente (público)
    location ~* ^/patient/login(-light)?\.html$ {
        try_files $uri =404;
    }

    # Protección de portal de Paciente (requiere cookie de sesión sillar_patient_auth)
    location /patient/ {
        if ($http_cookie !~* "sillar_patient_auth") {
            return 302 /patient/login.html;
        }
        try_files $uri $uri/ =404;
    }

    # Protección de consola Super Admin SaaS (requiere cookie sillar_superadmin_auth)
    location /superadmin/ {
        if ($http_cookie !~* "sillar_superadmin_auth") {
            return 302 /staff/login.html?redirect=superadmin;
        }
        try_files $uri $uri/ =404;
    }

    # Servir el resto de rutas (public, mobile, etc.)
    location / {
        try_files $uri $uri/ =404;
    }

    # Asignación de tipos MIME estándar
    types {
        text/html                             html htm;
        text/css                              css;
        application/javascript                js mjs;
        application/json                      json;
        image/jpeg                            jpeg jpg;
        image/png                             png;
        image/svg+xml                         svg;
        image/webp                            webp;
        application/pdf                       pdf;
        font/woff2                            woff2;
        font/woff                             woff;
        font/ttf                              ttf;
    }
}
