server {
    listen 80;
    server_name localhost;
    charset utf-8;

    # Preservar el puerto en la redirección enviando rutas relativas (Location: /public/index.html)
    absolute_redirect off;

    root /usr/share/nginx/html/prototype-v2;
    index public/index.html;

    # Compresión Gzip para alto rendimiento en pruebas y despliegue
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/html
        text/css
        text/plain
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2
        application/pdf;

    # Cabeceras de seguridad HTTP
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Redirección automática de la raíz http://localhost:8085/ a /public/index.html
    location = / {
        return 302 /public/index.html;
    }

    # Soporte para prototipo v1 en /prototype/
    location /prototype/ {
        alias /usr/share/nginx/html/prototype/;
        index index.html;
    }

    # Soporte para prototipos Stitch en /prototipo-stitc/
    location /prototipo-stitc/ {
        alias /usr/share/nginx/html/prototipo-stitc/;
        index index.html;
    }

    # Cabeceras para desarrollo y pruebas inmediatas (sin caché congelada en navegador)
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    # Servir las carpetas de prototype-v2 (public, patient, staff, mobile, data)
    location / {
        try_files $uri $uri/ =404;
    }

    # Asignación de tipos MIME estándar
    types {
        text/html                             html htm;
        text/css                              css;
        application/javascript                js mjs;
        application/json                      json;
        image/jpeg                            jpeg jpg;
        image/png                             png;
        image/svg+xml                         svg;
        image/webp                            webp;
        application/pdf                       pdf;
        font/woff2                            woff2;
        font/woff                             woff;
        font/ttf                              ttf;
    }
}
