<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor de Prototipos Stitch — Sillar Dental</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Design Tokens -->
  <link rel="stylesheet" href="theme-tokens.css">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-main: #060e1a;
      --bg-card: #0d1a2d;
      --bg-card-hover: #14253e;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f0f4fc;
      --text-muted: #94a3b8;
      --accent-green: #00e599;
      --accent-blue: #38bdf8;
      --accent-purple: #c084fc;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    /* Header */
    header {
      background: rgba(13, 26, 45, 0.8);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 1rem 2rem;
    }

    .header-container {
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #002046, #006c49);
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: var(--accent-green);
      border: 1px solid rgba(0, 229, 153, 0.3);
    }

    .brand-text h1 {
      font-family: 'Manrope', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-text p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .stats-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(0, 229, 153, 0.1);
      color: var(--accent-green);
      border: 1px solid rgba(0, 229, 153, 0.2);
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* Controls Bar */
    .controls-bar {
      max-width: 1440px;
      margin: 1.5rem auto 0;
      padding: 0 2rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .search-row {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 280px;
      position: relative;
    }

    .search-box i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      width: 18px;
    }

    .search-box input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 0.75rem 1rem 0.75rem 2.75rem;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent-green);
      box-shadow: 0 0 0 3px rgba(0, 229, 153, 0.15);
    }

    .filter-tabs {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      scrollbar-width: thin;
    }

    .tab-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .tab-btn:hover, .tab-btn.active {
      background: var(--bg-card-hover);
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .tab-btn.active {
      border-color: var(--accent-green);
      color: var(--accent-green);
      background: rgba(0, 229, 153, 0.08);
    }

    /* Main Grid */
    main {
      max-width: 1440px;
      margin: 1.5rem auto 3rem;
      padding: 0 2rem;
      width: 100%;
      flex: 1;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    .card-preview {
      height: 190px;
      background: #020914;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border-color);
    }

    .card-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      transition: transform 0.4s ease;
    }

    .card:hover .card-preview img {
      transform: scale(1.03);
    }

    .card-preview-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .card-badges {
      position: absolute;
      top: 0.75rem;
      left: 0.75rem;
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      z-index: 2;
    }

    .badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge-dark { background: #000000; color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .badge-light { background: #ffffff; color: #002046; border: 1px solid rgba(0, 32, 70, 0.2); }
    .badge-refined { background: #1e1b4b; color: #c084fc; border: 1px solid rgba(192, 132, 252, 0.3); }
    .badge-asset { background: #064e3b; color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3); }

    .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      flex: 1;
    }

    .card-category {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent-blue);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-title {
      font-family: 'Manrope', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
    }

    .card-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-clamp: 2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-tags {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
      margin-top: auto;
      padding-top: 0.5rem;
    }

    .tag-chip {
      font-size: 0.7rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      border: 1px solid transparent;
    }

    .btn-primary {
      background: rgba(0, 229, 153, 0.15);
      color: var(--accent-green);
      border-color: rgba(0, 229, 153, 0.3);
    }

    .btn-primary:hover {
      background: var(--accent-green);
      color: #000;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border-color: var(--border-color);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    /* Modal Viewer */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 9, 20, 0.9);
      backdrop-filter: blur(12px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 1200px;
      height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .modal-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      background: rgba(6, 14, 26, 0.6);
    }

    .modal-title-group h3 {
      font-family: 'Manrope', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: grid;
      place-items: center;

      transition: all 0.2s;
    }

    .modal-close:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    .modal-body {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .modal-body iframe, .modal-body img {
      width: 100%;
      height: 100%;
      border: none;
      object-fit: contain;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border-color);
      padding: 1.5rem 2rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      background: rgba(6, 14, 26, 0.5);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <div class="brand-title">
        <div class="brand-logo">
          <i data-lucide="sparkles"></i>
        </div>
        <div class="brand-text">
          <h1>Sillar Dental — Catálogo Stitch</h1>
          <p>Especificación de Diseños Partes 1, 2 y 3</p>
        </div>
      </div>
      <div style="display: flex; gap: 1rem; align-items: center;">
        <span class="stats-badge" id="stats-count">
          <i data-lucide="layers" style="width:14px;"></i> 45 Diseños Etiquetados
        </span>
        <a href="CATALOGO.md" target="_blank" class="btn btn-secondary">
          <i data-lucide="file-text" style="width:14px;"></i> Ver CATALOGO.md
        </a>
      </div>
    </div>
  </header>

  <div class="controls-bar">
    <div class="search-row">
      <div class="search-box">
        <i data-lucide="search"></i>
        <input type="text" id="search-input" placeholder="Buscar por nombre, categoría o etiqueta (ej. ortodoncia, dark, citas)...">
      </div>
    </div>

    <div class="filter-tabs" id="category-tabs">
      <!-- Generated via JS -->
    </div>
  </div>

  <main>
    <div class="grid-container" id="cards-grid">
      <!-- Cards rendered via JS -->
    </div>
  </main>

  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title-group">
          <h3 id="modal-title">Vista Previa</h3>
        </div>
        <div style="display:flex; gap:0.5rem; align-items:center;">
          <a id="modal-open-tab" href="#" target="_blank" class="btn btn-primary" style="font-size:0.75rem;">
            <i data-lucide="external-link" style="width:14px;"></i> Abrir Pestaña
          </a>
          <button class="modal-close" onclick="closeModal()">
            <i data-lucide="x"></i>
          </button>
        </div>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- Content inserted dynamically -->
      </div>
    </div>
  </div>

  <footer>
    Sillar Dental Prototipo &copy; 2026 — Clasificación y Etiquetado de Diseños Stitch
  </footer>

  <script>
    let catalogData = [];
    let activeCategory = 'all';

    async function init() {
      try {
        const res = await fetch('catalog.json');
        catalogData = await res.json();
        renderTabs();
        renderCards(catalogData);
        lucide.createIcons();
      } catch (e) {
        console.error("Error loading catalog.json", e);
      }
    }

    function renderTabs() {
      const categories = ['Todas', ...new Set(catalogData.map(i => i.category))];
      const container = document.getElementById('category-tabs');
      
      container.innerHTML = categories.map((cat, idx) => {
        const catKey = cat === 'Todas' ? 'all' : cat;
        const count = cat === 'Todas' ? catalogData.length : catalogData.filter(i => i.category === cat).length;
        return `
          <button class="tab-btn ${idx === 0 ? 'active' : ''}" onclick="filterCategory('${catKey}', this)">
            ${cat} (${count})
          </button>
        `;
      }).join('');
    }

    function filterCategory(catKey, btn) {
      activeCategory = catKey;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterData();
    }

    function filterData() {
      const search = document.getElementById('search-input').value.toLowerCase().trim();
      const filtered = catalogData.filter(item => {
        const matchesCategory = activeCategory === 'all' || item.category === activeCategory;
        const matchesSearch = !search || 
          item.title.toLowerCase().includes(search) || 
          item.htmlTitle.toLowerCase().includes(search) ||
          item.tags.some(t => t.toLowerCase().includes(search));
        return matchesCategory && matchesSearch;
      });

      renderCards(filtered);
      document.getElementById('stats-count').innerHTML = `<i data-lucide="layers" style="width:14px;"></i> ${filtered.length} Diseños`;
      lucide.createIcons();
    }

    document.getElementById('search-input').addEventListener('input', filterData);

    function renderCards(items) {
      const grid = document.getElementById('cards-grid');
      if (items.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 4rem; color: var(--text-muted);">No se encontraron diseños con ese filtro.</div>`;
        return;
      }

      grid.innerHTML = items.map(item => {
        const badgeClass = item.modeBadge === 'dark' ? 'badge-dark' : 
                           item.modeBadge === 'light' ? 'badge-light' : 
                           item.modeBadge === 'refined' ? 'badge-refined' : 'badge-asset';
        
        return `
          <div class="card">
            <div class="card-preview">
              <div class="card-badges">
                <span class="badge ${badgeClass}">${item.mode}</span>
              </div>
              ${item.relScreenPath ? `<img src="${item.relScreenPath}" alt="${item.title}" loading="lazy">` : `
                <div class="card-preview-placeholder">
                  <i data-lucide="file-code" style="width:32px; height:32px;"></i>
                  <span>Código de Especificación</span>
                </div>
              `}
            </div>
            <div class="card-body">
              <div class="card-category">${item.category}</div>
              <h3 class="card-title">${item.title}</h3>
              <p class="card-subtitle">${item.htmlTitle}</p>
              
              <div class="card-tags">
                ${item.tags.map(t => `<span class="tag-chip">${t}</span>`).join('')}
              </div>

              <div class="card-actions">
                ${item.hasCode ? `
                  <button class="btn btn-primary" onclick="openIframe('${item.relCodePath}', '${item.title}')">
                    <i data-lucide="eye" style="width:14px;"></i> Previsualizar
                  </button>
                ` : `
                  <button class="btn btn-secondary" disabled>Sin HTML</button>
                `}
                ${item.hasScreen ? `
                  <button class="btn btn-secondary" onclick="openImage('${item.relScreenPath}', '${item.title}')">
                    <i data-lucide="image" style="width:14px;"></i> Captura
                  </button>
                ` : `
                  <button class="btn btn-secondary" disabled>Sin Captura</button>
                `}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openIframe(url, title) {
      document.getElementById('modal-title').textContent = title + ' — Previsualización HTML';
      document.getElementById('modal-open-tab').href = url;
      document.getElementById('modal-body').innerHTML = `<iframe src="${url}"></iframe>`;
      document.getElementById('modal').classList.add('active');
    }

    function openImage(url, title) {
      document.getElementById('modal-title').textContent = title + ' — Captura Original';
      document.getElementById('modal-open-tab').href = url;
      document.getElementById('modal-body').innerHTML = `<img src="${url}" alt="${title}">`;
      document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
      document.getElementById('modal-body').innerHTML = '';
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    init();
  </script>
</body>
</html>
