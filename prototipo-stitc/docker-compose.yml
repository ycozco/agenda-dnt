services:
  prototipo-stitch-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sillar_dental_prototipo_stitch
    ports:
      - "8086:80"
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
